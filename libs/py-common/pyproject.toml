[project]
name = "auralis-common"
version = "1.0.0"
description = "Shared infrastructure for the Auralis Python services: event envelope, structured logging, error format, Kafka helpers, identity verification, telemetry."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "aiokafka>=0.11",
    "prometheus-client>=0.21",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.16.6,<0.17", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auralis_common"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
