# Next.js web client and the ingress that exposes it plus the gateway API.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: auralis
spec:
  selector: { app: frontend }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: auralis
  labels: { app: frontend }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/rakshit-gen/auralis-frontend:latest
          ports: [{ containerPort: 3000 }]
          env:
            # Build-time value is baked in; this is the runtime override the
            # server component picks up. Set it to the public API URL.
            - { name: NEXT_PUBLIC_API_BASE, value: "http://localhost:8080/api" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "500m", memory: "384Mi" }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auralis
  namespace: auralis
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: auralis.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port: { number: 3000 }
  # Add a tls block with a cert-manager issuer for HTTPS:
  # tls:
  #   - hosts: [auralis.example.com]
  #     secretName: auralis-tls
