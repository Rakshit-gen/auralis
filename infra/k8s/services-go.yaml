# The six Go services.
#
# Images default to the tag pushed by CI to GHCR; override per environment with
# kustomize or `kubectl set image`.
#
# Migrations: every Go service applies its embedded migrations on startup and
# records them in schema_migrations, so a boot with nothing to do is a no-op.
# The rollout strategy below (maxSurge 1, maxUnavailable 0) brings pods up one
# at a time, so a deploy that carries a new migration never has two pods
# applying it at once. Run infra/k8s/job-migrate.yaml first on a fresh cluster
# if you prefer an explicit step. Scale replicas up freely once the schema is
# current.
#
# gateway (no database) ------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: auralis
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: auralis
  labels: { app: gateway }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: ghcr.io/rakshit-gen/auralis-gateway:latest
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: auralis-config }
            - secretRef: { name: auralis-secrets }
          env:
            - { name: GATEWAY_HTTP_ADDR, value: ":8080" }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
# auth ---------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: auralis
spec:
  selector: { app: auth }
  ports: [{ port: 8081, targetPort: 8081 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: auralis
  labels: { app: auth }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: auth }
  template:
    metadata:
      labels: { app: auth }
    spec:
      containers:
        - name: auth
          image: ghcr.io/rakshit-gen/auralis-auth:latest
          ports: [{ containerPort: 8081 }]
          envFrom:
            - configMapRef: { name: auralis-config }
            - secretRef: { name: auralis-secrets }
          env:
            - { name: AUTH_HTTP_ADDR, value: ":8081" }
            - name: AUTH_DATABASE_URL
              valueFrom: { secretKeyRef: { name: auralis-db, key: AUTH_DATABASE_URL } }
            - name: AUTH_BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: auralis-secrets, key: ADMIN_EMAIL } }
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: auralis-secrets, key: ADMIN_PASSWORD } }
            - { name: AUTH_BOOTSTRAP_ADMIN_NAME, value: "Auralis Admin" }
          readinessProbe:
            httpGet: { path: /ready, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "96Mi" }
            limits: { cpu: "1", memory: "384Mi" }
---
