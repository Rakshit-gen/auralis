{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "auralis.labels" (dict "ctx" $ "name" $name) | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels: {{- include "auralis.labels" (dict "ctx" $ "name" $name) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/part-of: auralis
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "auralis.image" (dict "ctx" $ "name" $name "img" $svc.image) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            {{- include "auralis.envFrom" . | nindent 12 }}
          env:
            - name: {{ $svc.addrEnv }}
              value: {{ $svc.addrValue | quote }}
            {{- if $svc.dbEnv }}
            - name: {{ $svc.dbEnv }}
              valueFrom:
                secretKeyRef:
                  name: auralis-db
                  key: {{ $svc.dbEnv }}
            {{- end }}
            {{- if $svc.bootstrapAdmin }}
            - name: AUTH_BOOTSTRAP_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: auralis-secrets, key: ADMIN_EMAIL } }
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: auralis-secrets, key: ADMIN_PASSWORD } }
            - name: AUTH_BOOTSTRAP_ADMIN_NAME
              value: "Auralis Admin"
            {{- end }}
            {{- with $svc.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /ready, port: {{ $svc.port }} }
            initialDelaySeconds: {{ if $svc.pythonProbeDelay }}8{{ else }}5{{ end }}
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: {{ $svc.port }} }
            initialDelaySeconds: {{ if $svc.pythonProbeDelay }}15{{ else }}10{{ end }}
            periodSeconds: 20
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
{{- if .Values.worker.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-media-worker
  labels: {{- include "auralis.labels" (dict "ctx" . "name" "ai-media-worker") | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-media-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-media-worker
        app.kubernetes.io/part-of: auralis
    spec:
      containers:
        - name: worker
          image: {{ include "auralis.image" (dict "ctx" . "name" "ai-media-worker" "img" .Values.worker.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["worker"]
          envFrom:
            {{- include "auralis.envFrom" . | nindent 12 }}
          env:
            - name: SKIP_MIGRATE
              value: "true"
            - name: {{ .Values.worker.dbEnv }}
              valueFrom:
                secretKeyRef:
                  name: auralis-db
                  key: {{ .Values.worker.dbEnv }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
{{- end }}
{{- if .Values.frontend.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "auralis.labels" (dict "ctx" . "name" "frontend") | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "auralis.labels" (dict "ctx" . "name" "frontend") | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: auralis
    spec:
      containers:
        - name: frontend
          image: {{ include "auralis.image" (dict "ctx" . "name" "frontend" "img" .Values.frontend.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE
              value: {{ .Values.frontend.apiBase | quote }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- end }}
