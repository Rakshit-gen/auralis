[project]
name = "auralis-recommendation"
version = "1.0.0"
description = "Auralis recommendation service: personalized feed, similar shows, trending, and offline evaluation."
requires-python = ">=3.13"
dependencies = [
    "auralis-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "greenlet>=3.1",
    "psycopg[binary]>=3.2",
    "numpy>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auralis_reco"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
